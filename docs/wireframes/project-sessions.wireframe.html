<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目会话 · 交互原型</title><style>

ition:absolute;right:0;top:30px;background:white;border:1px solid #d5dbd5;border-radius:10px;box-shadow:0 4px 15px #0002;padding:5px;z-index:2;min-width:100px}.menu button{display:block;border:0;background:white;width:100%;text-align:left;padding:7px}.nav{margin-top:16px;padding:14px 8px 2px;border-top:1px solid #e2e6e0;font-weight:650}.main{min-width:0;display:flex;flex-direction:column;gap:16px}.panel{padding:14px 18px}.panel-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.project-title{font-weight:750;font-size:16px}.chip{border:1px solid #d2ddd4;background:#f8faf7;border-radius:99px;padding:2px 9px;font-size:11px;color:#435148}.chip.mode{color:#276c53}.details-toggle{margin-left:auto;border:0;background:transparent;color:#276c53;font-size:12px;font-weight:700;padding:4px 0}.path{color:#68776e;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}.detail{border-top:1px solid #e6eae5;margin-top:12px;padding-top:10px;font-size:12px;color:#68776e}.detail-line{margin:5px 0;overflow-wrap:anywhere}.detail b{color:#425148}.copy{border:1px solid #d4ded6;border-radius:20px;color:#276c53;background:#f8faf7;padding:3px 10px;font-size:11px;font-weight:700}.alert{margin:8px 0 0;color:#a33d35;font-size:12px}.thread{flex:1;min-height:400px}.message{padding:16px 18px;margin-bottom:14px}.role{font-weight:700;font-size:12px;color:#65736a}.composer{padding:16px 18px}.composer label{display:block;font-weight:700;margin-bottom:10px}.composer textarea{width:100%;min-height:75px;border:1px solid #d5ddd6;border-radius:10px;padding:10px;font:inherit;resize:vertical}.composer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.send{border:0;border-radius:10px;padding:8px 16px;background:#276c53;color:white;font-weight:700}.secondary{border:1px solid #d5ddd6;background:#fff;border-radius:10px;padding:8px 16px}.hint{font-size:11px;color:#829087;margin-top:7px}[hidden]{display:none!important}@media(max-width:760px){.app{display:block;margin:10px auto;padding:0 10px}.sidebar{margin-bottom:12px}.project-path{max-width:90%}.main{min-height:600px}.thread{min-height:260px}}
</style></head><body><div class="app"><aside class="sidebar" aria-label="导航"><div class="brand">◈ &nbsp;westie</div><button class="new" id="new">＋ 新建会话</button><div class="side-content"><div class="side-label">项目</div><div class="project"><span>▾</span><span class="project-name">my-agent-harness</span><button class="icon add" aria-label="为 my-agent-harness 新建会话">＋</button></div><div class="project-path">/Users/example/projects/my-agent-harness</div><div id="sessions"></div><div class="project"><span>▾</span><span class="project-name">another-project</span><button class="icon add" aria-label="为 another-project 新建会话">＋</button></div><div class="project-path">/Users/example/projects/another-project</div><div class="session"><button class="session-select" data-id="other"><span class="session-title"><span>整理设置页面</span><span class="badge">Sandbox</span></span><span class="time">10月28日 14:21 · 8c912a23</span></button><div class="menu-wrap"><button class="icon more" aria-label="会话操作：整理设置页面">⋯</button><div class="menu" hidden><button>重命名</button><button>删除</button></div></div></div></div><div class="nav">▣ &nbsp;MCP 服务器</div></aside><main class="main"><section class="panel" aria-label="当前项目"><div class="panel-top"><span class="kicker">当前项目</span><span class="project-title" id="project"></span><span class="chip" id="kind"></span><span class="chip" id="branch"></span><span class="chip mode" id="mode"></span><button class="details-toggle" id="toggle" aria-expanded="false" aria-controls="details">会话详情 ▾</button></div><div class="path" id="path" title=""></div><p class="alert" id="alert" role="alert" hidden></p><div class="detail" id="details" hidden><div class="detail-line"><b>项目主目录：</b><span id="root"></span></div><div class="detail-line"><b>会话 ID：</b><code id="id"></code> <button class="copy" id="copy">复制会话 ID</button> <span id="copied" role="status"></span></div><div class="detail-line">此会话的工作目录与执行模式不可更改</div></div></section><section class="thread" aria-label="对话记录"><div class="message"><div class="role">用户</div><p>为项目添加评测能力，先整理实现步骤。</p></div><div class="message"><div class="role">Agent</div><p>正在分析项目结构与现有测试…</p><div class="hint">● 运行中</div></div></section><section class="composer" aria-label="发送消息"><label for="message">发送消息</label><textarea id="message" placeholder="运行中可以插话，会在下一步生效"></textarea><div class="composer-actions"><button class="secondary" id="stop">停止</button><button class="send" id="send">插话</button></div><div class="hint">● 运行中 · 原型演示，不会启动 Agent 或创建会话。</div></section></main></div><script>
const sessions={evaluation:{title:'实现评测能力',project:'my-agent-harness',kind:'Worktree',branch:'feat/evaluation',mode:'Workspace Sandbox',root:'/Users/example/projects/my-agent-harness',path:'/Users/example/.westie/worktrees/my-agent-harness/evaluation',id:'411d76e5-302a-4537-8e71-520c4ca2d94a',time:'10月30日 17:13',running:true},rename:{title:'会话重命名',project:'my-agent-harness',kind:'主目录',branch:'feat/conversation-rename',mode:'Full Access',root:'/Users/example/projects/my-agent-harness',path:'/Users/example/projects/my-agent-harness',id:'03715fb0-7ec4-4c91-bdef-233a5001dc08',time:'10月28日 15:48'},missing:{title:'排查启动问题',project:'my-agent-harness',kind:'Worktree',branch:'分支未知',mode:'Workspace Sandbox',root:'/Users/example/projects/my-agent-harness',path:'/Users/example/.westie/worktrees/my-agent-harness/old',id:'32ab22d7-a97d-4bbc-9734-9e5ad5ad8191',time:'10月27日 14:40',unavailable:true},other:{title:'整理设置页面',project:'another-project',kind:'主目录',branch:'main',mode:'Workspace Sandbox',root:'/Users/example/projects/another-project',path:'/Users/example/projects/another-project',id:'8c912a23-5ecc-4e76-9079-09107a041122',time:'10月28日 14:21'}};
const list=document.querySelector('#sessions'); for(const [key,s] of Object.entries(sessions)){if(key==='other')continue;const row=document.createElement('div');row.className='session';row.dataset.row=key;row.innerHTML=`<button class="session-select" data-id="${key}"><span class="session-title"><span>${s.running?'<i class="dot" aria-label="运行中"></i>':''}${s.title}</span><span class="badge ${s.mode==='Full Access'?'full':''}">${s.mode==='Full Access'?'Full Access':'Sandbox'}</span></span><span class="time">${s.time} · ${s.id.slice(0,8)}</span></button><div class="menu-wrap"><button class="icon more" aria-label="会话操作：${s.title}">⋯</button><div class="menu" hidden><button ${s.running?'disabled title="会话正在运行"':''}>重命名</button><button ${s.running?'disabled title="会话正在运行"':''}>删除</button></div></div>`;list.append(row)}
function select(key){const s=sessions[key];document.querySelectorAll('.session').forEach(el=>el.classList.toggle('selected',el.querySelector('[data-id]')?.dataset.id===key));for(const [id,value] of Object.entries({project:s.project,kind:s.kind,branch:s.branch,mode:s.mode,path:s.path,root:s.root,id:s.id}))document.getElementById(id).textContent=value;document.querySelector('#path').title=s.path;const alert=document.querySelector('#alert');alert.hidden=!s.unavailable;alert.textContent=s.unavailable?'工作目录不可用：仍可查看历史记录，但不能在该目录启动新的 Run。':'';document.querySelector('#details').hidden=true;document.querySelector('#toggle').setAttribute('aria-expanded','false');document.querySelector('#toggle').textContent='会话详情 ▾';document.querySelector('#copied').textContent='';}
document.addEventListener('click',event=>{const selectButton=event.target.closest('[data-id]');if(selectButton)select(selectButton.dataset.id);const more=event.target.closest('.more');if(more){const menu=more.nextElementSibling;menu.hidden=!menu.hidden}if(event.target.closest('.add')||event.target.closest('#new'))location.href='create-worktree-session.wireframe.html'});
document.querySelector('#toggle').addEventListener('click',()=>{const d=document.querySelector('#details');d.hidden=!d.hidden;document.querySelector('#toggle').setAttribute('aria-expanded',String(!d.hidden));document.querySelector('#toggle').textContent=d.hidden?'会话详情 ▾':'收起详情 ▴'});document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(document.querySelector('#id').textContent);document.querySelector('#copied').textContent='已复制'}catch{document.querySelector('#copied').textContent='复制失败，请手动复制'}});select('evaluation');
</script></body></html>
